<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>My weightlifting gallery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }
    
        h1 {
            color: #333;
        }
    
        /* 图片网格的容器 */
        .image-container {
            display: flex;
            flex-wrap: wrap; /* 允许换行 */
            justify-content: center; /* 整体居中对齐 */
            gap: 20px; /* “正方形画布”之间的间距 */
            max-width: 1200px;
            margin: 30px auto 0;
        }
    
        /* 这是关键：定义“正方形画布”的样式 */
        .image-wrapper {
            width: calc(33.333% - 14px); /* 一行3个，减去gap的分布 */
            aspect-ratio: 1 / 1; /* 让这个容器强制保持1:1的宽高比（正方形） */
            
            background-color: #ffffff; /* 画布的背景色，留白部分会显示这个颜色 */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            
            /* 使用Flexbox让图片在“正方形画布”中垂直和水平都居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止意外溢出 */
        }
    
        /* 图片本身的样式 */
        .image-wrapper img {
            /* 限制图片最大宽高，确保它能被完整地装进正方形画布里 */
            max-width: 100%;
            max-height: 100%;
            /* 宽高设为auto，保持其原始比例，这样就不会被拉伸 */
            width: auto;
            height: auto;
        }
        
        /* 返回链接的样式 (如果你需要的话) */
        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    
        /* 针对小屏幕的响应式调整 */
        @media (max-width: 768px) {
            .image-wrapper {
                width: calc(50% - 10px); /* 在平板上每行显示2个 */
            }
        }
        @media (max-width: 480px) {
            .image-wrapper {
                width: 100%; /* 在手机上每行显示1个 */
            }
        }
    </style>
</head>
<body>

    <h1>My weightlifting gallery</h1>

    <div class="image-container">
        <div class="image-wrapper">
            <img src="./files/wl/wl1.jpg" alt="Weightlifting image 1">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl2.jpg" alt="Weightlifting image 2">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl3.jpg" alt="Weightlifting image 3">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl4.jpg" alt="Weightlifting image 4">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl5.jpg" alt="Weightlifting image 5">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl6.jpg" alt="Weightlifting image 6">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl7.jpg" alt="Weightlifting image 7">
        </div>
        <div class="image-wrapper">
            <img src="./files/wl/wl8.jpg" alt="Weightlifting image 8">
        </div>
    </div>

</body>
</html>
