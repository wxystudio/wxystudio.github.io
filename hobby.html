<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>My weightlifting gallery</title>
    <style>
        :root {
            --images-per-row: 3;
            --gap: 20px;
            --max-width: 1200px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--gap);
            max-width: var(--max-width);
            margin: 30px auto 0;
        }

        .image-wrapper {
            width: calc((100% - (var(--images-per-row) - 1) * var(--gap)) / var(--images-per-row));
            aspect-ratio: 1 / 1;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        @media (max-width: 768px) {
            .image-wrapper {
                width: calc((100% - var(--gap)) / 2);
            }
        }

        @media (max-width: 480px) {
            .image-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>My weightlifting gallery</h1>

    <div class="image-container" id="imageContainer"></div>

    <script>
        const totalImages = 27;
        const imagesPerRow = 3;

        document.documentElement.style.setProperty("--images-per-row", imagesPerRow);

        const imageContainer = document.getElementById("imageContainer");

        for (let i = 1; i <= totalImages; i++) {
            const wrapper = document.createElement("div");
            wrapper.className = "image-wrapper";

            const img = document.createElement("img");
            img.src = `./files/wl/wl${i}.jpg`;
            img.alt = `Weightlifting image ${i}`;

            wrapper.appendChild(img);
            imageContainer.appendChild(wrapper);
        }
    </script>

</body>
</html>
